<div class="support">
  <h2>Suporte</h2>
  <h3>FAQs</h3>
  <div *ngFor="let f of (faqs$ | async)" class="faq-item">
    <strong>{{ f.question }}</strong>
    <div>{{ f.answer }}</div>
  </div>

  <h3>Abrir ticket</h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Assunto</mat-label>
      <input matInput formControlName="subject">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Mensagem</mat-label>
      <textarea matInput formControlName="message" rows="4"></textarea>
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Enviar</button>
    <div *ngIf="sent" class="success-msg">Ticket enviado com sucesso!</div>
  </form>
</div>
